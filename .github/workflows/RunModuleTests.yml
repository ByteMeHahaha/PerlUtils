name: Run Module Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

jobs:
  run-module-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Run Module Tests
        run: |
          (
            cd src
            prove -lv t/*
          )
